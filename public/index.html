<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SimPage</title>
    <link rel="icon" id="site-favicon" href="/simpage-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/scripts/main.js" defer></script>
  </head>
  <body>
    <div class="ambient ambient-a" aria-hidden="true"></div>
    <div class="ambient ambient-b" aria-hidden="true"></div>
    <main class="layout">
      <section class="summary glass" aria-label="今日概览">
        <div class="summary-actions">
          <button type="button" class="summary-action theme-toggle" id="theme-toggle" aria-label="切换主题">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.106a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.894 17.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM6.106 17.894a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM4.5 12a.75.75 0 01-.75.75H1.5a.75.75 0 010-1.5h2.25a.75.75 0 01.75.75zM6.106 6.106a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z" />
            </svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 004.463-.945.75.75 0 01.981.981A10.503 10.503 0 0112 22.5a10.5 10.5 0 01-10.5-10.5c0-4.368 2.667-8.112 6.46-9.64a.75.75 0 01.818.162z" clip-rule="evenodd" />
            </svg>
          </button>
          <a class="summary-action admin-toggle" href="/admin.html" aria-label="进入管理后台" title="管理后台">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M11.0779 2.25C10.1613 2.25 9.37909 2.91265 9.22841 3.81675L9.04974 4.88873C9.02959 5.00964 8.93542 5.1498 8.75311 5.23747C8.40905 5.40292 8.07967 5.5938 7.7674 5.8076C7.60091 5.92159 7.43259 5.9332 7.31769 5.89015L6.29851 5.50833C5.44019 5.18678 4.4752 5.53289 4.01692 6.32666L3.09493 7.92358C2.63665 8.71736 2.8194 9.72611 3.52704 10.3087L4.36756 11.0006C4.46219 11.0785 4.53629 11.2298 4.52119 11.4307C4.50706 11.6188 4.49988 11.8086 4.49988 12C4.49988 12.1915 4.50707 12.3814 4.52121 12.5695C4.53632 12.7704 4.46221 12.9217 4.36758 12.9996L3.52704 13.6916C2.8194 14.2741 2.63665 15.2829 3.09493 16.0767L4.01692 17.6736C4.4752 18.4674 5.44019 18.8135 6.29851 18.4919L7.31791 18.11C7.43281 18.067 7.60113 18.0786 7.76761 18.1925C8.07982 18.4063 8.40913 18.5971 8.75311 18.7625C8.93542 18.8502 9.02959 18.9904 9.04974 19.1113L9.22841 20.1832C9.37909 21.0874 10.1613 21.75 11.0779 21.75H12.9219C13.8384 21.75 14.6207 21.0874 14.7713 20.1832L14.95 19.1113C14.9702 18.9904 15.0643 18.8502 15.2466 18.7625C15.5907 18.5971 15.9201 18.4062 16.2324 18.1924C16.3988 18.0784 16.5672 18.0668 16.6821 18.1098L17.7012 18.4917C18.5596 18.8132 19.5246 18.4671 19.9828 17.6733L20.9048 16.0764C21.3631 15.2826 21.1804 14.2739 20.4727 13.6913L19.6322 12.9994C19.5376 12.9215 19.4635 12.7702 19.4786 12.5693C19.4927 12.3812 19.4999 12.1914 19.4999 12C19.4999 11.8085 19.4927 11.6186 19.4785 11.4305C19.4634 11.2296 19.5375 11.0783 19.6322 11.0004L20.4727 10.3084C21.1804 9.72587 21.3631 8.71711 20.9048 7.92334L19.9828 6.32642C19.5246 5.53264 18.5596 5.18654 17.7012 5.50809L16.6818 5.89C16.5669 5.93304 16.3986 5.92144 16.2321 5.80746C15.9199 5.59371 15.5906 5.40289 15.2466 5.23747C15.0643 5.1498 14.9702 5.00964 14.95 4.88873L14.7713 3.81675C14.6207 2.91265 13.8384 2.25 12.9219 2.25H11.0779ZM12 15.75C14.0711 15.75 15.75 14.0711 15.75 12C15.75 9.92893 14.0711 8.25 12 8.25C9.92893 8.25 8.25 9.92893 8.25 12C8.25 14.0711 9.92893 15.75 12 15.75Z" />
            </svg>
          </a>
        </div>
        <div class="summary-main">
          <h1 class="sr-only" id="site-name">SimPage</h1>
          <span class="badge">今日概览</span>
          <div class="time-display" id="current-time">--:--:--</div>
          <div class="date-display" id="current-date">--</div>
          <div class="greeting" id="greeting-text">欢迎回来</div>
        </div>
        <div class="summary-meta">
          <div class="weather-block">
            <span class="weather-label">天气</span>
            <p class="weather-info" id="weather-info">正在获取天气...</p>
          </div>
          <form class="search-form" id="global-search-form">
            <label for="global-search" class="sr-only">搜索</label>
            <div class="search-controls">
              <div class="search-select" data-control="target">
                <label class="sr-only" for="search-target">搜索范围</label>
                <select id="search-target" name="target">
                  <option value="web">搜索</option>
                  <option value="apps">应用</option>
                  <option value="bookmarks">书签</option>
                </select>
              </div>
              <div class="search-select" data-control="engine">
                <span class="sr-only" id="search-engine-label">搜索引擎</span>
                <input type="hidden" id="search-engine" name="engine" value="google" />
                <div
                  class="search-engine-toggle"
                  role="group"
                  aria-labelledby="search-engine-label"
                >
                  <button
                    type="button"
                    class="search-engine-button is-active"
                    data-engine-option="google"
                    aria-pressed="true"
                    id="search-engine-google"
                    tabindex="0"
                  >
                    <span class="engine-icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24" focusable="false">
                        <path
                          fill="#4285F4"
                          d="M23.49 12.27c0-.78-.07-1.53-.2-2.27H12v4.3h6.48c-.28 1.5-1.13 2.77-2.4 3.62v3h3.87c2.26-2.08 3.54-5.14 3.54-8.65z"
                        ></path>
                        <path
                          fill="#34A853"
                          d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.87-3c-1.07.72-2.45 1.16-4.08 1.16-3.14 0-5.8-2.12-6.75-4.98H1.26v3.13C3.24 21.19 7.3 24 12 24z"
                        ></path>
                        <path
                          fill="#FBBC04"
                          d="M5.25 14.27c-.24-.72-.38-1.5-.38-2.27s.14-1.56.38-2.27V6.6H1.26C.46 8.2 0 9.99 0 12c0 2.01.46 3.8 1.26 5.4l3.99-3.13z"
                        ></path>
                        <path
                          fill="#EA4335"
                          d="M12 4.75c1.76 0 3.34.6 4.58 1.78l3.43-3.43C17.95 1.13 15.24 0 12 0 7.3 0 3.24 2.81 1.26 6.6l3.99 3.13C6.2 6.87 8.86 4.75 12 4.75z"
                        ></path>
                      </svg>
                    </span>
                    <span class="sr-only">Google</span>
                  </button>
                  <button
                    type="button"
                    class="search-engine-button"
                    data-engine-option="baidu"
                    aria-pressed="false"
                    id="search-engine-baidu"
                    tabindex="-1"
                  >
                    <span class="engine-icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24" focusable="false">
                        <circle cx="6.5" cy="7" r="3" fill="#3A7AFE"></circle>
                        <circle cx="12" cy="5.5" r="3" fill="#3A7AFE"></circle>
                        <circle cx="17.5" cy="7" r="3" fill="#3A7AFE"></circle>
                        <path
                          fill="#3A7AFE"
                          d="M12 10.5c-3.6 0-6.1 2.32-6.1 4.93 0 2.2 1.75 3.67 4.32 3.67.92 0 1.7-.22 1.78-.24.08.02.86.24 1.78.24 2.57 0 4.32-1.47 4.32-3.67 0-2.61-2.5-4.93-6.1-4.93z"
                        ></path>
                        <circle cx="8.9" cy="18" r="1.2" fill="#FF4D4F"></circle>
                        <circle cx="15.1" cy="18" r="1.2" fill="#FF4D4F"></circle>
                      </svg>
                    </span>
                    <span class="sr-only">百度</span>
                  </button>
                  <button
                    type="button"
                    class="search-engine-button"
                    data-engine-option="bing"
                    aria-pressed="false"
                    id="search-engine-bing"
                    tabindex="-1"
                  >
                    <span class="engine-icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24" focusable="false">
                        <path fill="#008373" d="M4 2l5 2v13.09L15.67 19 19 16.67l-4.34-2.1V6.07L4 2z"></path>
                      </svg>
                    </span>
                    <span class="sr-only">Bing</span>
                  </button>
                </div>
              </div>
            </div>
            <div class="search-input">
              <input
                type="search"
                id="global-search"
                name="query"
                placeholder="搜索网页、应用或书签..."
                autocomplete="off"
              />
              <button type="submit">搜索</button>
            </div>
            <p class="search-feedback" id="local-search-feedback" hidden></p>
          </form>
        </div>
      </section>

      <section class="grid-section glass" aria-labelledby="collections-title">
        <div class="section-header section-header-with-toggle">
          <div>
            <h2 id="collections-title">资源</h2>
            <p>我的在线应用与收藏站点</p>
          </div>
          <div
            class="collection-toggle"
            id="collection-toggle"
            role="tablist"
            aria-label="资源分类切换"
          >
            <button
              type="button"
              class="collection-toggle-button is-active"
              role="tab"
              id="apps-tab"
              data-view="apps"
              aria-controls="apps-panel"
              aria-selected="true"
              tabindex="0"
            >
              应用
            </button>
            <button
              type="button"
              class="collection-toggle-button"
              role="tab"
              id="bookmarks-tab"
              data-view="bookmarks"
              aria-controls="bookmarks-panel"
              aria-selected="false"
              tabindex="-1"
            >
              书签
            </button>
          </div>
        </div>
        <div class="collection-panels">
          <div
            class="collection-panel is-active"
            id="apps-panel"
            role="tabpanel"
            aria-labelledby="apps-tab"
          >
            <div class="grid" id="apps-grid" role="list"></div>
            <p class="empty-hint" id="apps-empty" hidden>
              暂无应用，请前往后台管理进行添加。
            </p>
          </div>
          <div
            class="collection-panel"
            id="bookmarks-panel"
            role="tabpanel"
            aria-labelledby="bookmarks-tab"
            hidden
          >
            <div class="bookmark-collection" id="bookmarks-grid"></div>
            <p class="empty-hint" id="bookmarks-empty" hidden>
              暂无书签，请前往后台管理进行添加。
            </p>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="site-footer" hidden>
      <div class="site-footer-inner">
        <div class="site-footer-content" id="site-footer-content"></div>
        <div class="site-footer-meta" id="site-footer-meta" hidden>
          <span class="site-footer-meta-label">访客量</span>
          <span class="site-footer-meta-value" id="site-visitor-count">0</span>
        </div>
      </div>
    </footer>

    <button type="button" class="back-to-top" id="back-to-top" aria-label="回到顶部" hidden>
      ⌃
    </button>
  </body>
</html>
